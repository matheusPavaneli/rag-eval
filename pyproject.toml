[project]
name = "rageval"
version = "0.1.0"
description = "Measured RAG: hybrid retrieval, verifiable citations, eval that fails CI on regression"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.12",
    "pydantic-settings>=2.7",
    "psycopg[binary]>=3.2",
    "httpx>=0.28",
    "onnxruntime>=1.22",
    "tokenizers>=0.21",
    "huggingface-hub>=0.34",
    "numpy>=2.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "mypy>=1.14",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rageval"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ANN", "S", "T20", "RUF"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"src/rageval/ingest/__main__.py" = ["T201"]
"src/rageval/retrieval/__main__.py" = ["T201"]
"src/rageval/eval/__main__.py" = ["T201"]
"scripts/**" = ["T201"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "scripts"]
mypy_path = "scripts"

[[tool.mypy.overrides]]
module = ["onnxruntime", "onnxruntime.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -m 'not integration'"
markers = [
    "integration: requires external services (Postgres, network); run with -m integration",
]
