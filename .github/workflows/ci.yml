name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-groups --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  integration:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: rageval
          POSTGRES_PASSWORD: rageval
          POSTGRES_DB: rageval
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U rageval -d rageval"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-groups --frozen
      - run: psql "$RAGEVAL_DATABASE_URL" -c 'CREATE EXTENSION IF NOT EXISTS vector'
        env:
          RAGEVAL_DATABASE_URL: postgresql://rageval:rageval@127.0.0.1:5433/rageval
          PGPASSWORD: rageval
      - run: uv run pytest -m integration
        env:
          RAGEVAL_DATABASE_URL: postgresql://rageval:rageval@127.0.0.1:5433/rageval

  quality-gate:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: rageval
          POSTGRES_PASSWORD: rageval
          POSTGRES_DB: rageval
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U rageval -d rageval"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      RAGEVAL_DATABASE_URL: postgresql://rageval:rageval@127.0.0.1:5433/rageval
      CORPUS: 26b03ce9a1c2c1d4
      BASELINE: evals/reports/20260918T175145Z-26b03ce9a1c2c1d4-bm25.json
      DENSE_BASELINE: evals/reports/20260918T175148Z-26b03ce9a1c2c1d4-dense.json
      HYBRID_BASELINE: evals/reports/20260918T175152Z-26b03ce9a1c2c1d4-hybrid-bm25.json
      ANSWER_BASELINE: evals/reports/20260918T175155Z-26b03ce9a1c2c1d4-answer-dense.json
      ANSWERS: evals/answers/26b03ce9a1c2c1d4-682ec1326b2f.jsonl
      VECTORS_TAG: vectors-26b03ce9a1c2c1d4
      VECTORS_FILE: embeddings-26b03ce9a1c2c1d4.jsonl.gz
      VECTORS_SHA256: 49f22cf2bc87a061005adce96737f5d22e7803bca063cbeba1b362bbde4bcc82
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run python -m rageval.ingest documents/
      - run: uv run python -m rageval.retrieval --corpus-version "$CORPUS" --lexical-only
      - run: >-
          uv run python -m rageval.eval --mode bm25 --corpus-version "$CORPUS"
          --baseline "$BASELINE" --fail-on-change
      - run: gh release download "$VECTORS_TAG" --pattern "$VECTORS_FILE" --dir "$RUNNER_TEMP"
        env:
          GH_TOKEN: ${{ github.token }}
      - run: >-
          uv run python -m rageval.vectors import "$RUNNER_TEMP/$VECTORS_FILE"
          --sha256 "$VECTORS_SHA256"
      - run: uv run python -m rageval.retrieval --corpus-version "$CORPUS"
      - run: >-
          uv run python -m rageval.eval --mode dense --corpus-version "$CORPUS"
          --baseline "$DENSE_BASELINE" --fail-on-change
      - run: >-
          uv run python -m rageval.eval --mode hybrid --fuse-with bm25 --corpus-version "$CORPUS"
          --baseline "$HYBRID_BASELINE" --fail-on-change
      - run: >-
          uv run python -m rageval.eval --answer --corpus-version "$CORPUS"
          --replay-answers "$ANSWERS" --baseline "$ANSWER_BASELINE" --fail-on-change
